<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Form Validation Exercise</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-container { width: 380px; border: 1px solid #ccc; padding: 15px 20px; border-radius: 5px; }
        h3 { text-align: center; margin-top: 0; }
        .form-group { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .form-group label { font-size: 13px; font-weight: bold; }
        .form-group input[type="text"], .form-group select { width: 170px; padding: 2px 4px; }
        .buttons { text-align: center; margin-top: 15px; }
        .buttons input { margin: 0 5px; cursor: pointer; }
    </style>
    <!-- Nhúng thư viện jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script9.js"></script>
</head>
<body>

    <div class="form-container">
        <h3>Personal Information</h3>
        <form id="registerForm">
            <div class="form-group">
                <label>Enter name*:</label>
                <input type="text" id="name">
            </div>

            <div class="form-group">
                <label>Sex*:</label>
                <div style="width: 178px;">
                    <label><input type="radio" name="sex" value="Male">Male</label>
                    <label><input type="radio" name="sex" value="Female">Female</label>
                </div>
            </div>

            <div class="form-group">
                <label>Enter email address*:</label>
                <input type="text" id="email">
            </div>

            <div class="form-group">
                <label>Enter birthday (MM/DD/YYYY)*:</label>
                <input type="text" id="birthday">
            </div>

            <div class="form-group">
                <label>Enter street address (line 1)*:</label>
                <input type="text" id="address">
            </div>

            <div class="form-group">
                <label>Enter city*:</label>
                <input type="text" id="city">
            </div>

            <div class="form-group">
                <label>Select a region*:</label>
                <select id="region">
                    <option value="">-- Chọn khu vực --</option>
                    <option value="Asia">Asia</option>
                    <option value="Europe">Europe</option>
                    <option value="America">America</option>
                </select>
            </div>

            <div class="form-group">
                <label>Enter 5-digit ZIP code*:</label>
                <input type="text" id="zipcode">
            </div>

            <div class="buttons">
                <input type="button" id="btnFinish" value="Finished">
                <input type="button" id="btnClear" value="Clear">
            </div>
        </form>
    </div>

</body>
</html>
