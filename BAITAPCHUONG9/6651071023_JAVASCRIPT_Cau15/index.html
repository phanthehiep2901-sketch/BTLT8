<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câu 15 - Chuyển Tab</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>Câu 15: Hiệu ứng Chuyển Tabs</h2>
        
        <div class="tabs-wrapper">
            <!-- Nút điều hướng Tab -->
            <ul class="tab-menu">
                <li class="active"><a href="#tab1">Tab 1</a></li>
                <li><a href="#tab2">Tab 2</a></li>
                <li><a href="#tab3">Tab 3</a></li>
            </ul>

            <!-- Khung nội dung tương ứng -->
            <div class="tab-content">
                <div id="tab1" class="tab-panel active">
                    <h3>Nội dung Tab 1</h3>
                    <p>Đây là nội dung hiển thị cho Tab thứ nhất.</p>
                </div>
                <div id="tab2" class="tab-panel">
                    <h3>Nội dung Tab 2</h3>
                    <p>Đây là nội dung hiển thị cho Tab thứ hai.</p>
                </div>
                <div id="tab3" class="tab-panel">
                    <h3>Nội dung Tab 3</h3>
                    <p>Đây là nội dung hiển thị cho Tab thứ ba.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
